name: Prüfen

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Einmal die Woche: hassfest und HACS ändern ihre Regeln, ohne dass sich
    # hier etwas ändert. Ein Fehlschlag soll auffallen, bevor jemand installiert.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml ruff
      - name: Rechnung, Struktur, Sensoren, Kosten und Dateien
        run: |
          python3 tests/test_rechnung.py
          python3 tests/test_topologie.py
          python3 tests/test_sensoren.py
          python3 tests/test_kosten.py
          python3 tests/test_dateien.py
      - name: Übersetzungen sind aktuell
        run: |
          python3 scripts/uebersetzungen.py
          git diff --exit-code -- custom_components/pv_system/strings.json \
                                  custom_components/pv_system/translations
      - name: Ruff
        run: ruff check --select F,E9,B,I --target-version py312 custom_components tests scripts

  importe:
    name: Import gegen aktuelles Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.9 verlangt >= 3.14.2.
          python-version: "3.14"
      - name: Home Assistant installieren
        run: pip install --prefer-binary homeassistant
      - name: Jedes Modul der Integration importieren
        # Der Test, den die anderen Prüfungen nicht leisten: Er zieht das
        # echte Home Assistant und führt die Importe aus. Wird ein Name in
        # einer neuen Fassung umbenannt oder entfernt, fällt es hier auf -
        # und nicht erst bei jemandem, der gerade aktualisiert hat.
        run: |
          python - <<'PY'
          import importlib, pathlib, sys

          sys.path.insert(0, str(pathlib.Path("custom_components").resolve()))
          from homeassistant.const import __version__ as ha_version

          print(f"Home Assistant {ha_version}")
          for name in (
              "pv_system",
              "pv_system.const",
              "pv_system.units",
              "pv_system.topology",
              "pv_system.coordinator",
              "pv_system.config_flow",
              "pv_system.sensor",
              "pv_system.stunde",
              "pv_system.websocket",
          ):
              importlib.import_module(name)
              print(f"  ok  {name}")

          # Der Importtest allein reicht nicht: Ein Selektor entsteht erst,
          # wenn das Formular gebaut wird. Genau dort ist einmal ein
          # unit_of_measurement=None hängengeblieben - der Dialog ließ sich
          # nicht mehr öffnen, und in der Oberfläche stand nur
          # "400: Bad Request". Deshalb werden hier alle Formulare erzeugt.
          from pv_system import config_flow as cf

          print("Formulare:")
          cf._schema_einrichtung()
          print("  ok  Einrichtung")
          for name in (
              "_felder_module",
              "_felder_laderegler",
              "_felder_batterie",
              "_felder_wechselrichter",
              "_felder_netz",
              "_felder_haus",
              "_felder_darstellung",
              "_felder_kosten",
              "_felder_anlagenkosten",
          ):
              cf._mit_vorschlag(getattr(cf, name)(), {})
              print(f"  ok  {name}")

          # Der Überschussschritt wächst mit der Zahl der Leistungssensoren.
          # Einmal ohne, einmal voll besetzt und einmal darüber hinaus: Ein
          # Selektor, der erst beim sechsten Verbraucher entsteht, fiele sonst
          # niemandem auf.
          for anzahl in (0, 1, 6, 9):
              cf._mit_vorschlag(cf._felder_ueberschuss(anzahl), {})
              print(f"  ok  _felder_ueberschuss({anzahl})")

          # Und die Abmeldung beim Recorder, am echten Home Assistant.
          #
          # Sie ist der Grund für diesen Block: In der Integration lag lange
          # eine recorder.py mit einem Haken, den Home Assistant nicht mehr
          # kennt. Importierbar war sie, also fiel sie nirgends auf. Geprüft
          # wird deshalb die Stelle, die Home Assistant wirklich ausliest -
          # die verschmolzene Menge, die mit jedem Zustand mitwandert.
          from pv_system.sensor import STRUKTUR, StatusSensor

          verschmolzen = StatusSensor._Entity__combined_unrecorded_attributes
          fehlend = set(STRUKTUR) - set(verschmolzen)
          assert not fehlend, f"nicht beim Recorder abgemeldet: {sorted(fehlend)}"
          print(f"Recorder: {len(STRUKTUR)} Attribute abgemeldet")

          # Die Geräte, am echten Geräteregister. Was in einem DeviceInfo
          # steht, übergibt Home Assistant als Parameter an
          # async_get_or_create - ein Name, den es dort nicht mehr gibt, wäre
          # ein TypeError beim Anlegen, und die Sensoren fehlten. So wäre es
          # mit via_device in 2027.8 gekommen. Abgekündigte Namen fallen
          # schon vorher auf, solange Home Assistant die Liste führt.
          import ast, inspect
          from homeassistant.helpers import device_registry as dr

          parameter = set(
              inspect.signature(dr.DeviceRegistry.async_get_or_create).parameters
          )
          baum = ast.parse(
              pathlib.Path("custom_components/pv_system/sensor.py").read_text("utf-8")
          )
          genutzt = {
              wort.arg
              for knoten in ast.walk(baum)
              if isinstance(knoten, ast.Call)
              and getattr(knoten.func, "id", None) == "DeviceInfo"
              for wort in knoten.keywords
          }
          assert "via_device_id" in genutzt, "Anlagen und Netz hängen nicht am Standort"
          fehlend = genutzt - parameter
          assert not fehlend, f"unbekannt im Geräteregister: {sorted(fehlend)}"
          veraltet = genutzt & set(getattr(dr, "_DEPRECATED_DEVICE_INFO_PARAMETERS", {}))
          assert not veraltet, f"abgekündigt: {sorted(veraltet)}"
          print(f"Geräte: {len(genutzt)} Felder, alle bekannt")
          PY

  karte:
    name: Karte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax der Lovelace-Karte
        run: node --check custom_components/pv_system/frontend/pv-system-card.js
