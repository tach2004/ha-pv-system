<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>PV-System</title>
  <!-- Ein Modulfeld, darüber die Sonne, darunter der Energiefluss.
       Bewusst nur zwei Farben: bernstein für die Erzeugung, dunkelblau für
       das Modul - dieselben Farben benutzt auch die Karte. -->
  <defs>
    <linearGradient id="modul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5f8f"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
  </defs>

  <!-- Sonne -->
  <circle cx="128" cy="54" r="25" fill="#f5a623"/>
  <g stroke="#f5a623" stroke-width="11" stroke-linecap="round">
    <path d="M128 10 V21"/>
    <path d="M79 20 L86 30"/>
    <path d="M177 20 L170 30"/>
    <path d="M46 54 H59"/>
    <path d="M210 54 H197"/>
  </g>

  <!-- Modulfeld, leicht perspektivisch -->
  <path d="M66 106 H190 L216 182 H40 Z" fill="url(#modul)"/>
  <g stroke="#6f9ec9" stroke-width="4" fill="none" opacity=".85">
    <path d="M107 106 L95 182"/>
    <path d="M149 106 L161 182"/>
    <path d="M57 131 H199"/>
    <path d="M48 157 H208"/>
  </g>

  <!-- Der Fluss nach unten: ein Blitz aus dem Feld heraus -->
  <path d="M142 188 L100 228 H126 L116 252 L158 210 H132 Z" fill="#f5a623"/>
</svg>
